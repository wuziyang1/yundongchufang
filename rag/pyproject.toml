[project]
name = "yundong-rag"
version = "0.1.0"
description = "运动处方知识库离线入库：PDF 解析 → 切片 → 向量化 → 写入 Milvus"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymilvus>=2.5.15,<2.6",
    "python-dotenv>=1.0.1",
    "openai>=1.59.6",
    # 固定 1.26：2.x 强制引入 pymupdf-layout，表格识别在体质标准评分表、指南三线表上明显变差
    "pymupdf>=1.26.5,<1.27",
    "langchain-text-splitters>=0.3.9",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
]

[tool.uv]
package = false
