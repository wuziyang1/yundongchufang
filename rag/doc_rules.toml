# 按文档定制的清洗规则（入库程序 indexer 在解析阶段读取，改完重新入库即可生效）
#
# 通用规则写在解析器和切片器里，对所有文档生效，不需要在这里配置：
#   封面 / 版权页（ISBN、CIP、定价、印刷信息）/ 编委会名单等前置页、期刊首页的标题作者单位区与作者脚注
#   （基金项目、通讯作者邮箱、Address correspondence）、扫描页插图里的 OCR 噪点、三线表、
#   「附录」标题、不足 50 折算字数的小切片（表注接上一块、章节引言并入下一块、孤立短标题丢弃）。
# 这里只放个别文档特有的版式问题。每条 [[doc]] 按文件名通配匹配（也可写相对 knowledge 的路径），
# 一个文件可匹配多条，规则依次合并。可用的键：
#
#   skip_pages     整页跳过，如 [1, 2, "5-7"]
#   headings       额外的章节标题写法：[[正则, 层级], ...]，层级 1 最高（通用规则：第X篇=1、一、=2、（一）=3、练习N：=4）
#   drop_sections  章节标题命中任一正则时，整个章节（直到同级或更高级的下一个标题）丢弃；表题命中时该表丢弃
#   drop_lines     命中任一正则的整行丢弃
#   replacements   文字替换 [[正则, 替换为], ...]，修正个别 PDF 的字形映射错误等
#
# 正则用单引号（TOML 字面量字符串），反斜杠不用转义。

[[doc]]
match = "中国儿童青少年身体活动指南*.pdf"
# 期刊版式的一级标题是「1 前言」「4 推荐意见及说明」「8 利益冲突说明」，以及不带编号的「经费来源」
headings = [
    ['^[1-9]\s*[一-鿿]{2,12}$', 1],
    ['^经费来源$', 1],
]
# 指南制作过程、利益冲突、经费来源、附表（28 部整合指南的出处列表）对运动处方没有参考价值，
# 留着还会因为挂在「问题10 哮喘」后面而被哮喘相关的查询召回
drop_sections = ['指南整合过程', '利益冲突', '^经费来源', '^附表', '整合指南概况表']

[[doc]]
match = "NSCA_Youth_Resistance_Training_*.pdf"
replacements = [
    # 这份 PDF 的符号字体映射错误：「×」被抽成「3」，「≥」「≤」被抽成「$」「#」，「d·wk⁻¹」被抽成「dwk21」
    ['(?<=\bsets) 3 (?=\d)', ' × '],
    ['\$(?=\s?\d)', '≥'],
    ['#(?=\s?\d)', '≤'],
    ['\bd\s*wk21', 'd·wk⁻¹'],
    # 摘要开头的引文格式（作者列表 + 期刊卷期），不是正文
    ['^Faigenbaum, AD, .*?S60–S79, 2009—', ''],
]

[[doc]]
match = "普通高中体育与健康课程标准*.pdf"
# 附录 2 的「案例N …」作为三级标题，便于按案例取舍
headings = [['^案例\s*\d+\s*[一-鿿]', 3]]
# 附录里的空白评价表单、评定表、调查表和健康教育理论测试题（判断题、单选题）
drop_sections = ['评价表$', '评定表$', '调查表$', '测试题$', '判断题', '单项选择题', '个人健康行为评估$']

[[doc]]
match = "青少年健康体能教学与训练指导手册*.pdf"
# 扫描件（已 OCR）。封面、版权页、编委会由通用的前置页规则跳过；「编写和使用说明」没有编号，补为一级标题
headings = [['^编写和使用说明$', 1]]
